const clockLabel = document.getElementById('live-clock');
function reportState(r, now) {
  const start = Date.parse(r.day + 'T' + r.start + ':00+08:00');
  const end = Date.parse(r.day + 'T' + r.end + ':00+08:00');
  return now >= end ? 'ended' : now >= start ? 'live' : 'upcoming';
}
function updateLiveStatus() {
  const now = Date.now();
  clockLabel.textContent = '北京时间 ' + new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',

  document.querySelectorAll('#list article').forEach(card => {
    const r = data[Number(card.dataset.reportIndex)];
    const state = reportState(r, now);
    card.classList.remove('ended', 'live', 'upcoming');
    card.classList.add(state);
    let label = card.querySelector('.status-label');
    if (!label) {
      label = document.createElement('span');
      label.className = 'status-label';
      card.querySelector('.badge').append(' ', label);
    }
    label.textContent = state === 'ended' ? '已结束' : state === 'live'

}
